<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="720" viewBox="0 0 1280 720" role="img" aria-labelledby="title desc">
  <title id="title">Velocity Skills workflow</title>
  <desc id="desc">An infographic showing four connected Velocity Skills: cook, stage, screenshot, and handoff.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#f8fbff"/>
      <stop offset="1" stop-color="#eef4ff"/>
    </linearGradient>
    <linearGradient id="cook" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#2563eb"/>
      <stop offset="1" stop-color="#06b6d4"/>
    </linearGradient>
    <linearGradient id="stage" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#16a34a"/>
      <stop offset="1" stop-color="#22c55e"/>
    </linearGradient>
    <linearGradient id="shot" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#d97706"/>
      <stop offset="1" stop-color="#f59e0b"/>
    </linearGradient>
    <linearGradient id="hand" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#7c3aed"/>
      <stop offset="1" stop-color="#4f46e5"/>
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="150%">
      <feDropShadow dx="0" dy="16" stdDeviation="18" flood-color="#0f172a" flood-opacity="0.12"/>
    </filter>
    <marker id="arrow-blue" markerWidth="12" markerHeight="12" refX="10" refY="6" orient="auto">
      <path d="M2 2l8 4-8 4z" fill="#2563eb"/>
    </marker>
    <marker id="arrow-green" markerWidth="12" markerHeight="12" refX="10" refY="6" orient="auto">
      <path d="M2 2l8 4-8 4z" fill="#16a34a"/>
    </marker>
    <marker id="arrow-amber" markerWidth="12" markerHeight="12" refX="10" refY="6" orient="auto">
      <path d="M2 2l8 4-8 4z" fill="#d97706"/>
    </marker>
  </defs>

  <rect width="1280" height="720" fill="url(#bg)"/>
  <circle cx="92" cy="92" r="180" fill="#dbeafe" opacity="0.55"/>
  <circle cx="1188" cy="620" r="220" fill="#ede9fe" opacity="0.7"/>

  <text x="640" y="88" text-anchor="middle" font-family="Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, Segoe UI, sans-serif" font-size="58" font-weight="850" fill="#0f172a">Velocity Skills</text>
  <text x="640" y="128" text-anchor="middle" font-family="Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, Segoe UI, sans-serif" font-size="22" font-weight="650" fill="#334155">Less time at the terminal. More finished work to review.</text>
  <text x="640" y="158" text-anchor="middle" font-family="Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, Segoe UI, sans-serif" font-size="17" fill="#64748b">Agent workflows for building, testing, and handing off web apps.</text>

  <g filter="url(#shadow)">
    <rect x="70" y="215" width="245" height="290" rx="26" fill="#ffffff" stroke="#2563eb" stroke-width="3"/>
    <circle cx="112" cy="263" r="27" fill="url(#cook)"/>
    <text x="112" y="273" text-anchor="middle" font-family="Inter, ui-sans-serif, system-ui" font-size="27" font-weight="800" fill="#ffffff">1</text>
    <text x="151" y="273" font-family="Inter, ui-sans-serif, system-ui" font-size="27" font-weight="850" fill="#0f172a">Cook</text>
    <rect x="102" y="310" width="181" height="105" rx="14" fill="#eff6ff" stroke="#bfdbfe" stroke-width="2"/>
    <path d="M131 340h24M131 364h68M131 388h44" stroke="#93c5fd" stroke-width="8" stroke-linecap="round"/>
    <path d="M220 340l-19 21 19 21M240 340l19 21-19 21" fill="none" stroke="#2563eb" stroke-width="8" stroke-linecap="round" stroke-linejoin="round"/>
    <text x="192" y="452" text-anchor="middle" font-family="Inter, ui-sans-serif, system-ui" font-size="18" font-weight="650" fill="#334155">Plan, build, test,</text>
    <text x="192" y="478" text-anchor="middle" font-family="Inter, ui-sans-serif, system-ui" font-size="18" font-weight="650" fill="#334155">and keep iterating.</text>
  </g>

  <g filter="url(#shadow)">
    <rect x="370" y="215" width="245" height="290" rx="26" fill="#ffffff" stroke="#16a34a" stroke-width="3"/>
    <circle cx="412" cy="263" r="27" fill="url(#stage)"/>
    <text x="412" y="273" text-anchor="middle" font-family="Inter, ui-sans-serif, system-ui" font-size="27" font-weight="800" fill="#ffffff">2</text>
    <text x="451" y="273" font-family="Inter, ui-sans-serif, system-ui" font-size="27" font-weight="850" fill="#0f172a">Stage</text>
    <rect x="402" y="310" width="181" height="105" rx="14" fill="#0f172a"/>
    <text x="430" y="346" font-family="SFMono-Regular, ui-monospace, Menlo, monospace" font-size="19" font-weight="700" fill="#22c55e">$ run</text>
    <text x="430" y="378" font-family="SFMono-Regular, ui-monospace, Menlo, monospace" font-size="18" fill="#d1fae5">✓ URL ready</text>
    <text x="430" y="405" font-family="SFMono-Regular, ui-monospace, Menlo, monospace" font-size="18" fill="#d1fae5">✓ isolated</text>
    <text x="492" y="452" text-anchor="middle" font-family="Inter, ui-sans-serif, system-ui" font-size="18" font-weight="650" fill="#334155">Run the branch in</text>
    <text x="492" y="478" text-anchor="middle" font-family="Inter, ui-sans-serif, system-ui" font-size="18" font-weight="650" fill="#334155">a real test environment.</text>
  </g>

  <g filter="url(#shadow)">
    <rect x="670" y="215" width="245" height="290" rx="26" fill="#ffffff" stroke="#d97706" stroke-width="3"/>
    <circle cx="712" cy="263" r="27" fill="url(#shot)"/>
    <text x="712" y="273" text-anchor="middle" font-family="Inter, ui-sans-serif, system-ui" font-size="27" font-weight="800" fill="#ffffff">3</text>
    <text x="751" y="273" font-family="Inter, ui-sans-serif, system-ui" font-size="27" font-weight="850" fill="#0f172a">Screenshot</text>
    <rect x="702" y="310" width="181" height="105" rx="14" fill="#fff7ed" stroke="#fed7aa" stroke-width="2"/>
    <rect x="718" y="327" width="149" height="14" rx="7" fill="#fdba74"/>
    <rect x="718" y="356" width="62" height="42" rx="8" fill="#bfdbfe"/>
    <path d="M731 389l22-24 15 17 10-11 27 30h-74z" fill="#2563eb"/>
    <path d="M797 360h52M797 383h40" stroke="#f59e0b" stroke-width="8" stroke-linecap="round"/>
    <text x="792" y="452" text-anchor="middle" font-family="Inter, ui-sans-serif, system-ui" font-size="18" font-weight="650" fill="#334155">Capture visual proof</text>
    <text x="792" y="478" text-anchor="middle" font-family="Inter, ui-sans-serif, system-ui" font-size="18" font-weight="650" fill="#334155">for fast review.</text>
  </g>

  <g filter="url(#shadow)">
    <rect x="970" y="215" width="245" height="290" rx="26" fill="#ffffff" stroke="#6d28d9" stroke-width="3"/>
    <circle cx="1012" cy="263" r="27" fill="url(#hand)"/>
    <text x="1012" y="273" text-anchor="middle" font-family="Inter, ui-sans-serif, system-ui" font-size="27" font-weight="800" fill="#ffffff">4</text>
    <text x="1051" y="273" font-family="Inter, ui-sans-serif, system-ui" font-size="27" font-weight="850" fill="#0f172a">Handoff</text>
    <rect x="1002" y="310" width="181" height="105" rx="14" fill="#f5f3ff" stroke="#ddd6fe" stroke-width="2"/>
    <rect x="1022" y="330" width="44" height="54" rx="10" fill="#7c3aed"/>
    <path d="M1036 347h17l8 8v15h-25zM1053 347v9h8" fill="none" stroke="#ffffff" stroke-width="4" stroke-linecap="round" stroke-linejoin="round"/>
    <path d="M1085 338h70M1085 364h54M1085 390h78" stroke="#c4b5fd" stroke-width="8" stroke-linecap="round"/>
    <text x="1092" y="452" text-anchor="middle" font-family="Inter, ui-sans-serif, system-ui" font-size="18" font-weight="650" fill="#334155">Deliver context,</text>
    <text x="1092" y="478" text-anchor="middle" font-family="Inter, ui-sans-serif, system-ui" font-size="18" font-weight="650" fill="#334155">status, and next steps.</text>
  </g>

  <path d="M326 360h34" stroke="#2563eb" stroke-width="6" stroke-linecap="round" marker-end="url(#arrow-blue)"/>
  <path d="M626 360h34" stroke="#16a34a" stroke-width="6" stroke-linecap="round" marker-end="url(#arrow-green)"/>
  <path d="M926 360h34" stroke="#d97706" stroke-width="6" stroke-linecap="round" marker-end="url(#arrow-amber)"/>

  <path d="M1093 535v38c0 30-24 54-54 54H242c-30 0-54-24-54-54v-38" fill="none" stroke="#4f46e5" stroke-width="5" stroke-linecap="round" opacity="0.42"/>
  <path d="M188 535v-2" stroke="#2563eb" stroke-width="5" stroke-linecap="round" marker-end="url(#arrow-blue)" opacity="0.7"/>
</svg>
